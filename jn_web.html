<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>jn</title>
<link rel="manifest" href="/manifest.json">
<style>
:root { --bg:#fff; --fg:#111; --mute:#777; --line:#e4e4e4; --chip:#f0f0f0; --chip-on:#111; --chip-on-fg:#fff; --accent:#0a66c2; --done:#2a9d5c; --danger:#c23b22; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#111; --fg:#eee; --mute:#888; --line:#2a2a2a; --chip:#222; --chip-on:#eee; --chip-on-fg:#111; --accent:#6cb4ff; } }
:root[data-theme="dark"] { --bg:#111; --fg:#eee; --mute:#888; --line:#2a2a2a; --chip:#222; --chip-on:#eee; --chip-on-fg:#111; --accent:#6cb4ff; }
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 -apple-system, system-ui, sans-serif; padding:0 16px calc(16px + env(safe-area-inset-bottom)); max-width:760px; margin-inline:auto }
textarea, input { width:100%; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px }
textarea { resize:none; min-height:44px; font-family:ui-monospace, Menlo, monospace; font-size:14px }
button { font:inherit; border:1px solid var(--line); background:var(--chip); color:var(--fg); border-radius:8px; padding:6px 12px; cursor:pointer }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent) }
button.danger { color:var(--danger) }
.row-actions { display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap }
.bar { display:flex; gap:8px; align-items:center }
.chips { display:flex; flex-wrap:wrap; gap:6px }
.chip { display:inline-flex; align-items:center; gap:4px; background:var(--chip); border-radius:999px; padding:2px 10px; font-size:13px; cursor:pointer; white-space:nowrap; border:0; color:var(--fg) }
.chip.on { background:var(--chip-on); color:var(--chip-on-fg) }
.chip .x { opacity:.6; margin-left:2px }
.chip .n { color:var(--mute); font-size:12px }
h1 { font-size:18px; margin:12px 0 8px }
h2.day { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin:18px 0 4px; position:sticky; top:0; background:var(--bg); padding:4px 0 }
.entry { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; padding:8px 0; border-bottom:1px solid var(--line); cursor:pointer }
.entry .meta { color:var(--mute); font-size:12px; font-variant-numeric:tabular-nums; padding-top:2px }
.entry .head { white-space:pre-wrap; word-break:break-word }
.entry .head .more { color:var(--mute) }
.entry .tags { grid-column:2; display:flex; flex-wrap:wrap; gap:4px }
.entry .tags .chip { font-size:11px; padding:0 8px }
.entry.done .head { color:var(--mute); text-decoration:line-through }
a.ref, a.tag { color:var(--accent); text-decoration:none }
#tags { margin:8px 0 }
#status { color:var(--mute); font-size:12px; margin-left:auto }
dialog { border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--fg); width:min(720px, calc(100vw - 32px)); padding:16px }
dialog::backdrop { background:#0006 }
dialog textarea { min-height:40vh }
pre { white-space:pre-wrap; font:13px ui-monospace, Menlo, monospace; color:var(--mute) }
details summary { cursor:pointer; color:var(--mute); font-size:13px }
.err { color:var(--danger); font-size:13px }
</style>
</head>
<body>
<h1>jn</h1>
<textarea id="capture" placeholder="log something… (@tags anywhere, ⌘↩ to save)" rows="2"></textarea>
<div class="row-actions">
  <button class="primary" id="save">Log</button>
  <button id="todo">Todo</button>
  <span id="cap-err" class="err"></span>
  <span id="status"></span>
</div>

<div class="bar" style="margin-top:16px">
  <input id="filter" placeholder="filter: @todo -@done @k=v word --since 1w">
</div>
<div class="chips" id="named" style="margin-top:8px"></div>
<details id="tags"><summary>tags</summary><div class="chips" id="taglist" style="margin-top:6px"></div></details>
<div id="list"></div>

<dialog id="detail">
  <div class="bar"><strong id="d-id"></strong><span id="d-when" style="color:var(--mute);font-size:12px"></span><span style="margin-left:auto"><button id="d-x">✕</button></span></div>
  <div class="chips" id="d-tags" style="margin:10px 0"></div>
  <input id="d-addtag" placeholder="add tag: @k=v, -@k, @k+=x  (↩)" style="margin-bottom:10px">
  <textarea id="d-text"></textarea>
  <pre id="d-back"></pre>
  <div class="row-actions">
    <button class="primary" id="d-save">Save</button>
    <button id="d-close">Close</button>
    <button id="d-reopen">Reopen</button>
    <span id="d-err" class="err"></span>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(argv, stdin = '') {
  const r = await fetch('/api', { method: 'POST', body: JSON.stringify({ argv, stdin }) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j.out;
}
const state = { named: new Set(), cfg: { filters: [], actions: [] } };
try { state.named = new Set(JSON.parse(localStorage.getItem('jn.named') || '[]')); $('#filter').value = localStorage.getItem('jn.filter') || ''; } catch {}
const tokens = () => [...$('#filter').value.trim().split(/\s+/).filter(Boolean), ...[...state.named].map(n => '--' + n)];

// #N and @tag in prose become links; done client-side on the first line only
function linkify(s) {
  return esc(s).replace(/(^|\s)#(\d+)\b/g, '$1<a class="ref" data-id="$2">#$2</a>')
               .replace(/(^|\s)@([A-Za-z_][\w-]*)(=\S+)?/g, '$1<a class="tag" data-tag="$2">@$2$3</a>');
}
const tagChip = (k, v, extra = '') => `<button class="chip" data-tag="${esc(k)}" ${extra}>@${esc(k)}${v ? '=' + esc(v) : ''}</button>`;
const dayLabel = d => {
  const t = new Date(), y = new Date(Date.now() - 864e5);
  const same = (a, b) => a.toDateString() === b.toDateString();
  return same(d, t) ? 'Today' : same(d, y) ? 'Yesterday' : d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: d.getFullYear() === t.getFullYear() ? undefined : 'numeric' });
};

async function refresh() {
  $('#status').textContent = '…';
  try {
    const [ls, tg] = await Promise.all([api(['ls', '--json', ...tokens()]), api(['tags', ...tokens()])]);
    const rows = ls.split('\n').filter(Boolean).map(JSON.parse).reverse();
    let html = '', day = '';
    for (const r of rows) {
      const d = new Date(r.created), lbl = dayLabel(d);
      if (lbl !== day) { html += `<h2 class="day">${lbl}</h2>`; day = lbl; }
      const lines = r.content.split('\n');
      html += `<div class="entry ${'done' in r.tags ? 'done' : ''}" data-id="${r.id}">
        <div class="meta">#${r.id}<br>${d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}</div>
        <div class="head">${linkify(lines[0])}${lines.length > 1 ? ' <span class="more">…</span>' : ''}</div>
        <div class="tags">${Object.entries(r.tags).map(([k, v]) => tagChip(k, v)).join('')}</div></div>`;
    }
    $('#list').innerHTML = html || '<p style="color:var(--mute)">nothing here</p>';
    $('#taglist').innerHTML = tg.split('\n').filter(Boolean).map(l => { const [n, t] = l.trim().split(/\s+/); return `<button class="chip" data-tag="${esc(t.slice(1))}">${esc(t)} <span class="n">${n}</span></button>`; }).join('');
    $('#status').textContent = rows.length + ' entries';
  } catch (e) { $('#status').textContent = e.message; }
}
function renderNamed() {
  $('#named').innerHTML = state.cfg.filters.map(n => `<button class="chip ${state.named.has(n) ? 'on' : ''}" data-named="${n}">--${n}</button>`).join('');
}

// capture
async function capture(cmd) {
  const text = $('#capture').value.trim();
  if (!text) return;
  $('#cap-err').textContent = '';
  try { await api([cmd], text); $('#capture').value = ''; refresh(); }
  catch (e) { $('#cap-err').textContent = e.message; }
}
$('#save').onclick = () => capture('log');
$('#todo').onclick = () => capture('todo');
$('#capture').onkeydown = e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') capture('log'); };

// filter + chips
let t;
$('#filter').oninput = () => { clearTimeout(t); t = setTimeout(() => { try { localStorage.setItem('jn.filter', $('#filter').value); } catch {} refresh(); }, 300); };
document.body.addEventListener('click', e => {
  const a = e.target.closest('[data-named],[data-tag],[data-id]');
  if (!a) return;
  if (a.dataset.named) {
    state.named.has(a.dataset.named) ? state.named.delete(a.dataset.named) : state.named.add(a.dataset.named);
    try { localStorage.setItem('jn.named', JSON.stringify([...state.named])); } catch {}
    renderNamed(); refresh();
  } else if (a.dataset.tag !== undefined && !a.closest('#d-tags')) {
    e.stopPropagation();
    const f = $('#filter'), tok = '@' + a.dataset.tag;
    if (!f.value.split(/\s+/).includes(tok)) { f.value = (f.value + ' ' + tok).trim(); f.oninput(); }
  } else if (a.dataset.id && !a.closest('#d-tags')) {
    e.stopPropagation(); openDetail(+a.dataset.id);
  }
});

// detail
let cur = null;
async function openDetail(id) {
  cur = id; $('#d-err').textContent = '';
  try {
    const [show, ls] = await Promise.all([api(['show', String(id)]), api(['ls', String(id), '--json', '--all'])]);
    const r = JSON.parse(ls.split('\n')[0] || '{}');
    const back = show.split('\n').filter(l => l.startsWith('<- '));
    $('#d-id').textContent = '#' + id;
    $('#d-when').textContent = r.created ? new Date(r.created).toLocaleString() : '';
    $('#d-text').value = show.split('\n').filter(l => !l.startsWith('<- ')).join('\n').trimEnd() + '\n';
    $('#d-back').innerHTML = back.map(l => linkify(l)).join('\n');
    $('#d-tags').innerHTML = Object.entries(r.tags || {}).map(([k, v]) => tagChip(k, v, `data-rm="${esc(k)}"`).replace('</button>', '<span class="x">✕</span></button>')).join('');
    $('#d-close').style.display = 'done' in (r.tags || {}) ? 'none' : '';
    $('#d-reopen').style.display = 'done' in (r.tags || {}) ? '' : 'none';
    if (!$('#detail').open) $('#detail').showModal();
  } catch (e) { $('#d-err').textContent = e.message; }
}
async function act(argv, stdin) {
  $('#d-err').textContent = '';
  try { await api(argv, stdin); await openDetail(cur); refresh(); } catch (e) { $('#d-err').textContent = e.message; }
}
$('#d-x').onclick = () => $('#detail').close();
$('#d-save').onclick = () => act(['edit', String(cur)], $('#d-text').value);
$('#d-close').onclick = () => act(['close', String(cur)]);
$('#d-reopen').onclick = () => act(['tag', String(cur), '-@done']);
$('#d-addtag').onkeydown = e => { if (e.key === 'Enter' && e.target.value.trim()) { act(['tag', String(cur), ...e.target.value.trim().split(/\s+/)]); e.target.value = ''; } };
$('#d-tags').onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { e.stopPropagation(); act(['tag', String(cur), '-@' + b.dataset.rm]); } };
$('#d-text').onkeydown = e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') $('#d-save').onclick(); };
$('#detail').onclose = () => { cur = null; };

// boot + poll
fetch('/config').then(r => r.json()).then(c => { state.cfg = c; renderNamed(); refresh(); });
setInterval(() => { if (document.visibilityState === 'visible' && !$('#detail').open) refresh(); }, 5000);
</script>
</body>
</html>
