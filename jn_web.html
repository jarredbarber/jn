<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14261F">
<title>jn</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2314261F'/%3E%3Ctext x='9' y='47' font-family='Georgia,serif' font-size='44' font-style='italic' fill='%23F2EFE6'%3Ej%3Ctspan font-style='normal' font-weight='bold' fill='%23FF7A1A'%3En%3C/tspan%3E%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Hanken+Grotesk:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#14261F; --bg2:#1B3229; --ink:#F2EFE6; --mute:#8FA69A; --rule:#2C4A3E; --accent:#FF7A1A; --accent-ink:#14261F;
  --serif:"Bodoni Moda", "Didot", "Bodoni 72", serif; --sans:"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --gutter:72px; --r:4px;
}
* { box-sizing:border-box }
html { background:var(--bg) }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--sans); min-height:100vh; padding:0 16px calc(48px + env(safe-area-inset-bottom)) }
body::before { /* grain */
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.14; mix-blend-mode:soft-light;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
::selection { background:var(--accent); color:var(--accent-ink) }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
button, input, textarea, select { font:inherit; color:inherit }

.col { max-width:1004px; margin:0 auto; position:relative; z-index:1 }
.mast, .composer, .lens { max-width:760px }
.mast { display:flex; align-items:baseline; gap:16px; padding:26px 0 0 }
.mast h1 { font:italic 400 44px/1 var(--serif); letter-spacing:-.02em; margin:0 }
.mast h1 a { color:inherit; text-decoration:none }
.mast h1 b { font-style:normal; font-weight:700; color:var(--accent) }
.statwrap { margin-left:auto; text-align:right; line-height:1.3 }
#dbpath { color:var(--mute); font-size:11px; opacity:.7; display:block; max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl }
#status { color:var(--mute); font-size:13px }
#dbsel { background:var(--bg2); color:var(--ink); border:1px solid var(--rule); border-radius:var(--r); padding:4px 8px; font-size:14px }

/* composer, above the feed */
.composer { margin:26px 0 0 }
textarea, input { width:100%; background:var(--bg2); border:1px solid var(--rule); border-radius:var(--r); padding:12px 14px; color:var(--ink) }
textarea::placeholder, input::placeholder { color:var(--mute) }
textarea:focus, input:focus { border-color:var(--ink); outline:none }
textarea { resize:none; min-height:64px; line-height:1.45 }
#capture:focus { min-height:120px }
.actions { display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap }
button { background:transparent; border:1px solid var(--ink); border-radius:var(--r); padding:8px 16px; cursor:pointer; line-height:1.2 }
button:hover { background:var(--bg2) }
button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); box-shadow:3px 3px 0 var(--ink); font-weight:600 }
button.primary:hover { transform:translate(1px,1px); box-shadow:2px 2px 0 var(--ink) }
button.primary kbd { font:500 11px/1 var(--sans); opacity:.65; margin-left:8px; padding:2px 5px; border:1px solid currentColor; border-radius:3px; vertical-align:1px }
button.quiet { border-color:var(--rule); color:var(--mute); padding:6px 12px }
.err { color:var(--accent); font-size:13px }

/* lens */
.lens { margin:26px 0 0; border-top:1px solid var(--rule); padding-top:16px }
.lens input { font-size:15px; padding:9px 12px }
.chips { display:flex; flex-wrap:wrap; gap:6px }
.chip { display:inline-flex; align-items:center; gap:0; background:transparent; border:1px solid var(--rule); border-radius:var(--r); padding:3px 9px; font-size:13px; cursor:pointer; white-space:nowrap; color:var(--ink); line-height:1.4 }
.chip:hover { border-color:var(--mute) }
.chip.on { background:var(--ink); color:var(--bg); border-color:var(--ink) }
.chip .x { opacity:.55; margin-left:6px }
.chip .x:hover { opacity:1; color:var(--accent) }
.chip .n { color:var(--mute); font-size:12px; margin-left:5px }
.chip.on .n { color:var(--bg2) }
.chip .ref { color:var(--accent); text-decoration:none }
.chip .ref:hover { text-decoration:underline }
#named { margin-top:10px }
#viewname { display:none; margin-top:8px; padding:6px 10px; font-size:14px }
.chip.tinted, .entry .tags .chip.tinted { color:var(--tc); border-color:var(--tc) }  /* ponytail: your hex, your contrast */
.chip .fav { color:var(--tc, var(--accent)); font-size:8px; margin-right:5px; vertical-align:middle }

/* ledger left, tag column right; the column drops under the filter on a phone */
.main { display:grid; grid-template-columns:minmax(0,760px) 220px; gap:0 24px; align-items:start }
#list { grid-column:1; grid-row:1 }
.side { grid-column:2; grid-row:1; position:sticky; top:16px; padding-top:28px }
.side .lab { color:var(--mute); font-size:13px; margin-bottom:8px }
.side .chips { gap:4px }
/* activity heatmap (github-style), #7 */
#cal { display:grid; grid-template-rows:repeat(7, 1fr); grid-auto-flow:column; gap:3px; margin-bottom:22px; position:relative }
#cal .cell { width:100%; aspect-ratio:1; border-radius:2px; background:var(--bg2) }
#cal .cell.l1 { background:rgba(255,122,26,.3) }
#cal .cell.l2 { background:rgba(255,122,26,.55) }
#cal .cell.l3 { background:rgba(255,122,26,.8) }
#cal .cell.l4 { background:var(--accent) }
#cal .cell.lx { background:transparent }  /* future days in this week */
#cal .cell:hover::after { content:attr(aria-label); position:absolute; right:0; bottom:calc(100% + 6px); z-index:10; padding:5px 8px; border:1px solid var(--rule); border-radius:var(--r); background:var(--ink); color:var(--bg); font:13px/1.4 var(--sans); white-space:nowrap; pointer-events:none }
@media (max-width:760px) { #cal { max-width:340px } }

/* ledger */
.ledger { margin-top:8px }
.day { display:grid; grid-template-columns:minmax(var(--gutter), max-content) minmax(0, 1fr); align-items:end; border-top:3px double var(--ink); margin:34px 0 6px }
.ledger .day:first-child { margin-top:20px }
.day .num { font:700 48px/0.8 var(--serif); letter-spacing:-.04em; margin-top:-.42em; background:var(--bg); padding-right:8px; width:max-content; color:var(--ink) }
.day .rest { font-size:14px; color:var(--mute); padding:12px 0 6px }
.day .rest strong { color:var(--ink); font-weight:500; margin-right:10px }
.entry { display:grid; grid-template-columns:var(--gutter) 1fr; padding:14px 0 12px; border-bottom:1px solid var(--rule); min-width:0 }
.entry .gut, .entry .head { cursor:pointer }
.entry:not(.open):hover .head { color:var(--accent) }
.gut { display:flex; flex-direction:column; gap:2px; padding-top:3px }
.eid { font-size:12px; color:var(--mute); text-decoration:none }
.eid:hover { color:var(--accent) }
.time { font-size:12px; color:var(--mute); font-variant-numeric:tabular-nums }
.head { margin:0; white-space:pre-wrap; word-break:break-word; font-size:17px; line-height:1.4 }
.head .more { color:var(--mute) }
.entry .tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px }
.entry .tags .chip { font-size:11px; padding:1px 7px; color:var(--mute) }
.entry.done .head { color:var(--mute); text-decoration:line-through; text-decoration-color:var(--accent) }
.entry.child { margin-left:calc(var(--depth) * 22px); border-left:2px solid var(--rule); padding-left:12px }
.tree-root { margin-top:18px }
a.ref, a.tag { color:var(--accent); text-decoration:none }
a.ref:hover, a.tag:hover { text-decoration:underline }
.empty { color:var(--mute); font:italic 400 22px/1.3 var(--serif); padding:24px 0 0 var(--gutter) }

/* inline editor */
.entry.open { background:var(--bg2); margin:0 -16px; padding:16px 16px 14px; border-top:1px solid var(--ink); border-bottom:1px solid var(--ink) }
.entry.open .head, .entry.open .tags { display:none }
.editor { min-width:0 }
.editor .tagrow { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:10px }
.editor .tagrow .chip { padding:3px 9px; font-size:13px }
.editor .tagrow input { width:auto; flex:1; min-width:140px; padding:4px 8px; font-size:13px; background:transparent; border-color:transparent }
.editor .tagrow input:focus { border-color:var(--rule) }
.editor .tagrow input.editing { flex:0 0 auto; width:max-content; min-width:80px; background:var(--bg); border-color:var(--ink) }
.editor textarea { background:var(--bg); min-height:120px; field-sizing:content }
.editor .back { margin:8px 0 0; color:var(--mute); font-size:13px; white-space:pre-wrap }
.entry.open .requote { display:none }
.anc { display:flex; gap:8px; align-items:baseline; margin:6px 0; padding:0 0 0 10px; border-left:2px solid var(--rule); color:var(--mute); font-size:13px }
.anc > a.ref { flex:none }
.anc p { margin:0 }
.requote { margin:0; color:var(--mute); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.editor:not(.editing) .when-edit { display:none } .editor.editing .when-view { display:none }  /* one action bar, two modes */

/* rendered markdown */
.md { min-width:0; word-break:break-word; margin:4px 0 10px; padding:2px 0 }
.md > :first-child { margin-top:0 } .md > :last-child { margin-bottom:0 }
.md p, .md ul, .md ol, .md pre, .md blockquote, .md table { margin:0 0 .7em }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font:italic 400 17px/1.25 var(--serif); letter-spacing:-.01em; margin:.9em 0 .35em }
.md h1 { font-size:22px } .md h2 { font-size:19px }
.md code, .md pre { font:13.5px/1.45 ui-monospace, Menlo, monospace; background:var(--bg); border:1px solid var(--rule); border-radius:var(--r) }
.md code { padding:1px 5px } .md pre { padding:10px 12px; overflow:auto } .md pre code { border:0; padding:0; background:none }
.md blockquote { border-left:2px solid var(--accent); color:var(--mute); margin-left:0; padding-left:12px }
.md ul, .md ol { padding-left:1.4em } .md li > ul, .md li > ol, .md li > p { margin-bottom:0 }
.md li.task { list-style:none; margin-left:-1.4em }
.md input[type=checkbox] { width:auto; padding:0; border:0; background:none; accent-color:var(--accent); margin:0 .5em 0 0; vertical-align:-1px; cursor:pointer }  /* undo the global input rule */
.md a { color:var(--accent) } .md del { color:var(--mute) }
.md img { max-width:100%; height:auto; border:1px solid var(--rule); border-radius:var(--r) }
.md hr { border:0; border-top:1px solid var(--rule); margin:1em 0 }
.md table { border-collapse:collapse; font-size:14px; display:block; max-width:100%; overflow:auto }
.md th, .md td { border:1px solid var(--rule); padding:4px 10px; text-align:left }
.md th { background:var(--bg) }  /* ponytail: spec said --bg2, but the open entry already sits on --bg2 so it would vanish */

/* attachments */
.att { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; align-items:flex-start }
.att-item { display:inline-flex; align-items:flex-start; gap:4px; font-size:13px; max-width:100% }
.att img { display:block; max-height:160px; max-width:100%; border:1px solid var(--rule); border-radius:var(--r) }
.att a { color:var(--accent); text-decoration:none; word-break:break-all }
.att a:hover { text-decoration:underline }
.att .x, .att .ins { color:var(--mute); cursor:pointer; padding:0 2px }
.att .ins { font-size:11px; border:1px solid var(--rule); border-radius:var(--r); padding:0 5px }
.att .x:hover, .att .ins:hover { color:var(--accent); border-color:var(--accent) }
.entry .tags .clip { font-size:11px; color:var(--mute); align-self:center; opacity:.8 }
#pending:not(:empty) { margin-top:12px }

/* completion */
#ac { position:fixed; z-index:20; background:var(--ink); color:var(--bg); border:1px solid var(--ink); border-radius:var(--r); box-shadow:4px 4px 0 var(--accent); max-height:40vh; overflow:auto; overscroll-behavior:contain; min-width:180px; display:none }
#ac div { padding:7px 12px; cursor:pointer; font-size:14px }
#ac div.sel { background:var(--accent); color:var(--accent-ink) }

@media (max-width: 760px) {
  .main { display:block }
  .side { position:static; padding-top:10px }
}
@media (max-width: 600px) {
  :root { --gutter:56px }
  .mast { padding-top:18px }
  .mast h1 { font-size:34px }
  .head { font-size:16px }
  .entry.child { margin-left:calc(var(--depth) * 14px); padding-left:8px }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important } }
</style>
</head>
<body>
<div class="col">
<header class="mast"><h1><a href="/" id="home">j<b>n</b></a></h1><select id="dbsel" hidden></select><span class="statwrap"><span id="dbpath" title=""></span><span id="status"></span></span></header>
<div class="composer">
  <textarea id="capture" placeholder="Write it down. @tags anywhere, @todo makes a task." rows="2"></textarea>
  <div class="actions">
    <button class="primary" id="save">Add <kbd>⌘↩</kbd></button>
    <span id="cap-err" class="err"></span>
  </div>
  <div class="att" id="pending"></div>
</div>
<div class="lens">
  <input id="filter" placeholder="@todo -@done @k=v word --since 1w --tree">
  <div class="chips" id="named"></div>
  <input id="viewname" placeholder="Name this view, ↩ saves it to ~/.jn">
</div>
<div class="main">
<aside class="side" id="tags"><div class="lab">activity</div><div id="cal"></div><div class="lab">tags in view</div><div class="chips" id="taglist"></div></aside>
<section class="ledger" id="list"></section>
</div>
</div>
<div id="ac"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state = { cfg: { filters: [] }, vocab: {}, db: '', rows: [] };
try { state.db = localStorage.getItem('jn.db') || ''; } catch {}
let cur = null;  // id of the entry open inline

async function api(verb, body = {}) {
  const r = await fetch('/api/' + verb, { method: 'POST', body: JSON.stringify(state.db ? { db: state.db, ...body } : body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j.out;
}

// the query is the filter box; --name and --tree live in it as tokens, and the URL mirrors it
const tokens = () => $('#filter').value.trim().split(/\s+/).filter(Boolean);
const has = t => tokens().includes(t);
function toggleTok(t) { const ts = tokens(); $('#filter').value = (ts.includes(t) ? ts.filter(x => x !== t) : [...ts, t]).join(' '); }
function setQuery(q, push = true) {
  $('#filter').value = q;
  const u = new URL(location); q ? u.searchParams.set('q', q) : u.searchParams.delete('q'); state.db ? u.searchParams.set('db', state.db) : u.searchParams.delete('db');
  history[push ? 'pushState' : 'replaceState'](null, '', u);
  renderNamed(); refresh();
}
function fromUrl() { const u = new URL(location); if (u.searchParams.has('db')) state.db = u.searchParams.get('db'); $('#filter').value = u.searchParams.get('q') || ''; }
const entryHref = id => '?q=' + id + (state.db ? '&db=' + encodeURIComponent(state.db) : '');  // #11: shareable link; ⌘-click opens the entry in its own window

// #N and @tag in prose become links
const refs = s => s.replace(/(^|[\s(=,])#(\d+)\b/g, (_, p, id) => `${p}<a class="ref" href="${entryHref(id)}" data-id="${id}">#${id}</a>`)  // s is already escaped
                   .replace(/(^|\s)@([A-Za-z_][\w-]*)(=\S+)?/g, '$1<a class="tag" data-tag="$2">@$2$3</a>');
const linkify = s => refs(esc(s));
const refify = v => esc(v).replace(/#(\d+)\b/g, (_, id) => `<a class="ref" href="${entryHref(id)}" data-id="${id}">#${id}</a>`);
const tcol = t => { const c = (state.cfg.colors || {})[t] || ''; return /^#[0-9a-f]{3,8}$/i.test(c) ? c : ''; };  // only a #hex gets into a style attr: a project .jn is data, not css
const chipAttrs = k => { const c = tcol(k); return `class="chip${c ? ' tinted' : ''}"${c ? ` style="--tc:${c}"` : ''} data-tag="${esc(k)}"`; };
const tagChip = (k, v, extra = '') => `<span ${chipAttrs(k)} ${extra}>@${esc(k)}${v ? '=' + refify(v) : ''}</span>`;
const atify = t => t.replace(/^(-?)(?!@)/, '$1@');  // tag fields take bare words: foo -> @foo, -foo -> -@foo
const dayLabel = d => {
  const t = new Date(), y = new Date(Date.now() - 864e5);
  const same = (a, b) => a.toDateString() === b.toDateString();
  return same(d, t) ? 'Today' : same(d, y) ? 'Yesterday' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: d.getFullYear() === t.getFullYear() ? undefined : 'numeric' });
};

async function refresh() {
  $('#status').textContent = '…';
  try {
    const [rows, tg, vocab] = await Promise.all([api('ls', { args: tokens() }), api('tags', { args: tokens() }), api('vocab')]);
    state.vocab = vocab;
    const tree = rows.some(r => 'depth' in r);
    if (!tree) rows.reverse();
    state.rows = rows;
    let html = '', day = '';
    for (const r of rows) {
      const d = new Date(r.created), lbl = dayLabel(d);
      if (!tree && lbl !== day) {
        const full = d.toLocaleDateString(undefined, { weekday: 'long' }) + ', ' + d.toLocaleDateString(undefined, { month: 'long', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
        html += `<header class="day"><span class="num">${d.getDate()}</span><span class="rest"><strong>${lbl}</strong>${full}</span></header>`; day = lbl;
      }
      const lines = r.content.split('\n'), head = lines.map(mdHead).find(l => l.trim()) || '';
      html += `<article class="entry ${'done' in r.tags ? 'done' : ''} ${r.depth ? 'child' : tree ? 'tree-root' : ''}" style="--depth:${r.depth || 0}" data-id="${r.id}">
        <div class="gut"><span class="time">${d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}</span><a class="eid" href="${entryHref(r.id)}" data-id="${r.id}" title="Open this entry (⌘-click for a new window)">#${r.id}</a></div>
        <div class="body">${r.parent_ctx ? `<p class="requote">${linkify(r.parent_ctx)}</p>` : ''}<p class="head">${linkify(head)}${lines.length > 1 ? ' <span class="more">…</span>' : ''}</p>
        <div class="tags">${Object.entries(r.tags).filter(([k]) => k !== 'files').map(([k, v]) => tagChip(k, v)).join('')}${clip(r.tags)}</div></div></article>`;
    }
    $('#list').innerHTML = html || '<p class="empty">Nothing matches. Write something, or loosen the filter.</p>';
    const fav = state.cfg.favorites || [], cnt = Object.fromEntries(tg);
    $('#taglist').innerHTML = [...fav, ...tg.map(([t]) => t).filter(t => !fav.includes(t))]
      .map(t => `<span ${chipAttrs(t)}>${fav.includes(t) ? '<span class="fav">●</span>' : ''}@${esc(t)} <span class="n">${cnt[t] || 0}</span></span>`).join('');
    renderCal();
    $('#status').textContent = rows.length + ' entries';
    const ts = tokens();
    if (cur !== null) await openEntry(cur, false);
    else if (ts.length === 1 && /^#?\d+$/.test(ts[0]) && rows.length === 1) await openEntry(rows[0].id, false);  // #11: a single-entry view opens expanded
  } catch (e) { $('#status').textContent = e.message; }
}
function renderCal() {  // #7: per-day entry counts for the current view, last 17 weeks, github-style
  const day = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return +d; };
  const cnt = {};
  for (const r of state.rows) cnt[day(r.created)] = (cnt[day(r.created)] || 0) + 1;
  const today = day(Date.now()), weeks = 17;
  const cell = new Date(today);
  cell.setDate(cell.getDate() + (6 - cell.getDay()) - (weeks * 7 - 1));  // Sunday, 17 weeks back (step by setDate so DST can't drift the key off local midnight)
  const max = Math.max(1, ...Object.values(cnt));
  let cells = '';
  for (let i = 0; i < weeks * 7; i++, cell.setDate(cell.getDate() + 1)) {
    const t = +cell, c = cnt[t] || 0;
    const lvl = t > today ? 'x' : c === 0 ? 0 : Math.min(4, Math.ceil(c / max * 4));
    const label = cell.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) + `: ${c} ${c === 1 ? 'entry' : 'entries'}`;
    cells += `<i class="cell l${lvl}" role="img" aria-label="${esc(label)}"></i>`;
  }
  $('#cal').innerHTML = cells;
}
function renderNamed() {
  $('#named').innerHTML = state.cfg.filters.map(f => `<span class="chip ${has('--' + f.name) ? 'on' : ''}" data-tok="--${f.name}">--${f.name}${f.own ? '<span class="x" data-del="' + f.name + '">✕</span>' : ''}</span>`).join('')
    + `<span class="chip ${has('--tree') ? 'on' : ''}" data-tok="--tree" title="Nest entries under their @parent">tree</span>`

ac.el.onmousedown = e => { e.preventDefault(); const d = e.target.closest('[data-i]'); if (d) acPick(+d.dataset.i); };  // keep the field focused, scrollbar included
addEventListener('scroll', () => ac.field && acPlace(), true); addEventListener('resize', () => ac.field && acPlace());

// boot + poll
fromUrl();
api('dbs').then(dbs => {
  if (!dbs.length) return;
  if (state.db && !dbs.includes(state.db)) state.db = '';
  const sel = $('#dbsel');
  sel.innerHTML = ['', ...dbs].map(n => `<option value="${esc(n)}" ${n === state.db ? 'selected' : ''}>${n ? esc(n) : 'default'}</option>`).join('');
  sel.hidden = false;
  sel.onchange = () => { state.db = sel.value; try { localStorage.setItem('jn.db', state.db); } catch {} cur = null; setQuery($('#filter').value.trim(), false); api('config').then(c => { state.cfg = c; setDbPath(c.db); renderNamed(); }); };
});
function setDbPath(p) { const el = $('#dbpath'); el.textContent = p ? '‎' + p : ''; el.title = p || ''; }  // ‎ (LRM) keeps the ellipsis at the left under direction:rtl
api('config').then(c => { state.cfg = c; setDbPath(c.db); renderNamed(); refresh(); });
setInterval(() => { if (document.visibilityState === 'visible' && cur === null) refresh(); }, 5000);
</script>
