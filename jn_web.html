<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14261F">
<title>jn</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Hanken+Grotesk:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#14261F; --bg2:#1B3229; --ink:#F2EFE6; --mute:#8FA69A; --rule:#2C4A3E; --accent:#FF7A1A; --accent-ink:#14261F;
  --serif:"Bodoni Moda", "Didot", "Bodoni 72", serif; --sans:"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --gutter:88px; --r:4px;
}
* { box-sizing:border-box }
html { background:var(--bg) }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--sans); min-height:100vh; padding:0 0 calc(24px + env(safe-area-inset-bottom)) }
body::before { /* grain */
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.14; mix-blend-mode:soft-light;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
::selection { background:var(--accent); color:var(--accent-ink) }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
button, input, textarea { font:inherit; color:inherit }

/* shell: hangs off the left, never centered */
.mast { display:flex; align-items:baseline; gap:18px; padding:26px 5vw 0 5vw }
.mast h1 { font:italic 400 44px/1 var(--serif); letter-spacing:-.02em; margin:0 }
.mast h1 b { font-style:normal; font-weight:700; color:var(--accent) }
#status { color:var(--mute); font-size:13px }
#dbsel { background:var(--bg2); color:var(--ink); border:1px solid var(--rule); border-radius:var(--r); padding:4px 8px; font-size:14px; width:auto }
.shell { display:grid; grid-template-columns:minmax(260px, 320px) minmax(0, 760px); gap:0 6vw; padding:32px 5vw 0 5vw; position:relative; z-index:1 }
.pen { position:sticky; top:20px; align-self:start; display:flex; flex-direction:column; gap:22px }

/* composer */
textarea, input { width:100%; background:var(--bg2); border:1px solid var(--rule); border-radius:var(--r); padding:12px 14px; color:var(--ink) }
textarea::placeholder, input::placeholder { color:var(--mute) }
textarea:focus, input:focus { border-color:var(--ink); outline:none }
textarea { resize:none; min-height:112px; line-height:1.45 }
.actions { display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap }
button { background:transparent; border:1px solid var(--ink); border-radius:var(--r); padding:8px 16px; cursor:pointer; line-height:1.2 }
button:hover { background:var(--bg2) }
button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); box-shadow:3px 3px 0 var(--ink); font-weight:600 }
button.primary:hover { transform:translate(1px,1px); box-shadow:2px 2px 0 var(--ink) }
.err { color:var(--accent); font-size:13px }

/* lens: filter, views, tags */
.lens h2 { font:italic 400 22px/1 var(--serif); margin:0 0 10px; color:var(--mute) }
.chips { display:flex; flex-wrap:wrap; gap:6px }
.chip { display:inline-flex; align-items:center; gap:5px; background:transparent; border:1px solid var(--rule); border-radius:var(--r); padding:3px 9px; font-size:13px; cursor:pointer; white-space:nowrap; color:var(--ink) }
.chip:hover { border-color:var(--mute) }
.chip.on { background:var(--ink); color:var(--bg); border-color:var(--ink) }
.chip .x { opacity:.55; margin-left:2px }
.chip .n { color:var(--mute); font-size:12px }
.chip.on .n { color:var(--bg2) }
#named { margin-top:10px }
#viewname { display:none; margin-top:8px; padding:6px 10px; font-size:14px }
#tags { margin-top:12px }
#tags summary { cursor:pointer; color:var(--mute); font-size:13px; list-style:none }
#tags summary::before { content:"+ "; color:var(--accent) }
#tags[open] summary::before { content:"– " }
#taglist { margin-top:8px }

/* ledger */
.ledger { min-width:0 }
.day { display:grid; grid-template-columns:var(--gutter) 1fr; align-items:end; border-top:3px double var(--ink); margin:34px 0 6px; padding-top:0 }
.ledger .day:first-child { margin-top:0 }
.day .num { font:700 72px/0.8 var(--serif); letter-spacing:-.04em; margin-top:-.42em; background:var(--bg); padding-right:8px; display:inline-block; width:max-content; color:var(--ink) }
.day .rest { font-size:14px; color:var(--mute); padding:12px 0 6px }
.day .rest strong { color:var(--ink); font-weight:500; margin-right:10px }
.entry { display:grid; grid-template-columns:var(--gutter) 1fr; gap:0 0; padding:14px 0 12px; border-bottom:1px solid var(--rule); cursor:pointer; min-width:0 }
.entry:hover .head { color:var(--accent) }
.gut { display:flex; flex-direction:column; gap:2px; padding-top:1px }
.eid { font:italic 400 20px/1 var(--serif); color:var(--ink) }
.time { font-size:12px; color:var(--mute); font-variant-numeric:tabular-nums }
.head { margin:0; white-space:pre-wrap; word-break:break-word; font-size:17px; line-height:1.4 }
.head .more { color:var(--mute) }
.entry .tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px }
.entry .tags .chip { font-size:11px; padding:1px 7px; color:var(--mute) }
.entry.done .head { color:var(--mute); text-decoration:line-through; text-decoration-color:var(--accent) }
.entry.child { margin-left:calc(var(--depth) * 22px); border-left:2px solid var(--rule); padding-left:12px }
.entry.child .eid { font-size:16px }
.tree-root { margin-top:18px }
.entry.done .eid { color:var(--mute) }
a.ref, a.tag { color:var(--accent); text-decoration:none }
a.ref:hover, a.tag:hover { text-decoration:underline }
.empty { color:var(--mute); font:italic 400 22px/1.3 var(--serif); padding:24px 0 0 var(--gutter) }

/* detail */
dialog { border:1px solid var(--ink); border-radius:calc(var(--r) * 2); background:var(--bg); color:var(--ink); width:min(720px, calc(100vw - 32px)); padding:20px; box-shadow:10px 10px 0 var(--accent) }
dialog::backdrop { background:rgba(20,38,31,.82) }
dialog .bar { display:flex; align-items:baseline; gap:12px }
#d-id { font:italic 400 32px/1 var(--serif) }
#d-when { color:var(--mute); font-size:13px }
#d-x { margin-left:auto; border-color:var(--rule); padding:4px 10px }
dialog textarea { min-height:38vh; margin-top:10px }
#d-tags { margin:14px 0 8px }
#d-back { margin:8px 0 0; color:var(--mute); font-size:13px; white-space:pre-wrap }

/* completion */
#ac { position:fixed; z-index:20; background:var(--ink); color:var(--bg); border:1px solid var(--ink); border-radius:var(--r); box-shadow:4px 4px 0 var(--accent); max-height:40vh; overflow:auto; min-width:180px; display:none }
#ac div { padding:7px 12px; cursor:pointer; font-size:14px }
#ac div.sel { background:var(--accent); color:var(--accent-ink) }

@media (max-width: 760px) {
  :root { --gutter:64px }
  .mast { padding:18px 16px 0 }
  .mast h1 { font-size:34px }
  .shell { display:block; padding:18px 16px 0 }
  .pen { position:static; display:block }
  .lens { margin-bottom:8px }
  .composer { position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--bg); border-top:1px solid var(--ink); padding:10px 16px calc(10px + env(safe-area-inset-bottom)) }
  .composer textarea { min-height:56px; height:56px }
  .composer textarea:focus { height:112px }
  .composer .actions { margin-top:8px }
  body { padding-bottom:150px }
  .day .num { font-size:56px }
  .head { font-size:16px }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important } }
</style>
</head>
<body>
<header class="mast"><h1>j<b>n</b></h1><select id="dbsel" hidden></select><span id="status"></span></header>
<main class="shell">
  <aside class="pen">
    <div class="composer">
      <textarea id="capture" placeholder="Write it down. @tags anywhere. ⌘↩ saves." rows="3"></textarea>
      <div class="actions">
        <button class="primary" id="save">Save entry</button>
        <button id="todo">Save as todo</button>
        <span id="cap-err" class="err"></span>
      </div>
    </div>
    <div class="lens">
      <h2>Show</h2>
      <input id="filter" placeholder="@todo -@done @k=v word --since 1w">
      <div class="chips" id="named"></div>
      <input id="viewname" placeholder="Name this view, ↩ saves it to ~/.jn">
      <details id="tags"><summary>tags in view</summary><div class="chips" id="taglist"></div></details>
    </div>
  </aside>
  <section class="ledger" id="list"></section>
</main>
<div id="ac"></div>

<dialog id="detail">
  <div class="bar"><span id="d-id"></span><span id="d-when"></span><button id="d-x" aria-label="close">✕</button></div>
  <div class="chips" id="d-tags"></div>
  <input id="d-addtag" placeholder="Add a tag: @k=v, -@k, @k+=x, ↩">
  <textarea id="d-text"></textarea>
  <pre id="d-back"></pre>
  <div class="actions">
    <button class="primary" id="d-save">Save changes</button>
    <button id="d-close">Mark done</button>
    <button id="d-reopen">Reopen</button>
    <button id="d-sub">Add subtask</button>
    <span id="d-err" class="err"></span>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(verb, body = {}) {
  const r = await fetch('/api/' + verb, { method: 'POST', body: JSON.stringify(state.db ? { db: state.db, ...body } : body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j.out;
}
const state = { named: new Set(), cfg: { filters: [] }, vocab: {}, db: '', tree: false };
try { state.tree = !!localStorage.getItem('jn.tree'); } catch {}
try { state.db = localStorage.getItem('jn.db') || ''; } catch {}
try { state.named = new Set(JSON.parse(localStorage.getItem('jn.named') || '[]')); $('#filter').value = localStorage.getItem('jn.filter') || ''; } catch {}
const tokens = () => [...$('#filter').value.trim().split(/\s+/).filter(Boolean), ...[...state.named].map(n => '--' + n), ...(state.tree ? ['--tree'] : [])];

// #N and @tag in prose become links; done client-side on the first line only
function linkify(s) {
  return esc(s).replace(/(^|\s)#(\d+)\b/g, '$1<a class="ref" data-id="$2">#$2</a>')
               .replace(/(^|\s)@([A-Za-z_][\w-]*)(=\S+)?/g, '$1<a class="tag" data-tag="$2">@$2$3</a>');
}
const tagChip = (k, v, extra = '') => `<button class="chip" data-tag="${esc(k)}" ${extra}>@${esc(k)}${v ? '=' + esc(v) : ''}</button>`;
const dayLabel = d => {
  const t = new Date(), y = new Date(Date.now() - 864e5);
  const same = (a, b) => a.toDateString() === b.toDateString();
  return same(d, t) ? 'Today' : same(d, y) ? 'Yesterday' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: d.getFullYear() === t.getFullYear() ? undefined : 'numeric' });
};

async function refresh() {
  $('#status').textContent = '…';
  try {
    const [rows, tg, vocab] = await Promise.all([api('ls', { args: tokens() }), api('tags', { args: tokens() }), api('vocab')]);
    state.vocab = vocab;
    const tree = rows.some(r => 'depth' in r);
    if (!tree) rows.reverse();  // tree rows arrive in forest order already
    let html = '', day = '';
    for (const r of rows) {
      const d = new Date(r.created), lbl = dayLabel(d);
      if (!tree && lbl !== day) {
        const full = d.toLocaleDateString(undefined, { weekday: 'long' }) + ', ' + d.toLocaleDateString(undefined, { month: 'long', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
        html += `<header class="day"><span class="num">${d.getDate()}</span><span class="rest"><strong>${lbl}</strong>${full}</span></header>`; day = lbl;
      }
      const lines = r.content.split('\n');
      html += `<article class="entry ${'done' in r.tags ? 'done' : ''} ${r.depth ? 'child' : tree ? 'tree-root' : ''}" style="--depth:${r.depth || 0}" data-id="${r.id}">
        <div class="gut"><span class="eid">${r.id}</span><span class="time">${d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}</span></div>
        <div class="body"><p class="head">${linkify(lines[0])}${lines.length > 1 ? ' <span class="more">…</span>' : ''}</p>
        <div class="tags">${Object.entries(r.tags).map(([k, v]) => tagChip(k, v)).join('')}</div></div></article>`;
    }
    $('#list').innerHTML = html || '<p class="empty">Nothing matches. Write something, or loosen the filter.</p>';
    $('#taglist').innerHTML = tg.map(([t, n]) => `<button class="chip" data-tag="${esc(t)}">@${esc(t)} <span class="n">${n}</span></button>`).join('');
    $('#status').textContent = rows.length + ' entries';
  } catch (e) { $('#status').textContent = e.message; }
}
function renderNamed() {
  $('#named').innerHTML = state.cfg.filters.map(f => `<button class="chip ${state.named.has(f.name) ? 'on' : ''}" data-named="${f.name}">--${f.name}${f.own ? '<span class="x" data-del="' + f.name + '">✕</span>' : ''}</button>`).join('')
    + `<button class="chip ${state.tree ? 'on' : ''}" id="treetoggle" title="Nest entries under their @parent">tree</button>`
    + `<button class="chip" id="saveview" title="Save the filter box as a named view in ~/.jn">+ save view</button>`;
  $('#treetoggle').onclick = () => { state.tree = !state.tree; try { localStorage.setItem('jn.tree', state.tree ? '1' : ''); } catch {} renderNamed(); refresh(); };
  $('#saveview').onclick = () => { const v = $('#viewname'); v.style.display = v.style.display === 'block' ? 'none' : 'block'; if (v.style.display === 'block') v.focus(); };
}
async function saveFilter(name, expr) {
  try {
    const c = await api('filter', expr === null ? { name } : { name, expr });
    state.cfg.filters = c.filters;
    if (expr === null) state.named.delete(name); else { $('#filter').value = ''; state.named.add(name); }
    try { localStorage.setItem('jn.named', JSON.stringify([...state.named])); localStorage.setItem('jn.filter', $('#filter').value); } catch {}
    $('#viewname').value = ''; $('#viewname').style.display = 'none';
    renderNamed(); refresh();
  } catch (e) { $('#status').textContent = e.message; }
}
$('#viewname').onkeydown = e => {
  if (e.key === 'Enter' && e.target.value.trim()) saveFilter(e.target.value.trim(), [...$('#filter').value.trim().split(/\s+/).filter(Boolean), ...[...state.named].map(n => '--' + n)].join(' '));
  if (e.key === 'Escape') e.target.style.display = 'none';
};

// capture
async function capture(prefix) {
  const text = $('#capture').value.trim();
  if (!text) return;
  $('#cap-err').textContent = '';
  try { await api('log', { text: prefix + text }); $('#capture').value = ''; refresh(); }
  catch (e) { $('#cap-err').textContent = e.message; }
}
$('#save').onclick = () => capture('');
$('#todo').onclick = () => capture('@todo ');
$('#capture').onkeydown = e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') capture(''); };

// filter + chips
let t;
$('#filter').oninput = () => { clearTimeout(t); t = setTimeout(() => { try { localStorage.setItem('jn.filter', $('#filter').value); } catch {} refresh(); }, 300); };
document.body.addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del) { e.stopPropagation(); saveFilter(del.dataset.del, null); return; }
  const a = e.target.closest('[data-named],[data-tag],[data-id]');
  if (!a) return;
  if (a.dataset.named) {
    state.named.has(a.dataset.named) ? state.named.delete(a.dataset.named) : state.named.add(a.dataset.named);
    try { localStorage.setItem('jn.named', JSON.stringify([...state.named])); } catch {}
    renderNamed(); refresh();
  } else if (a.dataset.tag !== undefined && !a.closest('#d-tags')) {
    e.stopPropagation();
    const f = $('#filter'), tok = '@' + a.dataset.tag;
    if (!f.value.split(/\s+/).includes(tok)) { f.value = (f.value + ' ' + tok).trim(); f.oninput(); }
  } else if (a.dataset.id && !a.closest('#d-tags')) {
    e.stopPropagation(); openDetail(+a.dataset.id);
  }
});

// detail
let cur = null;
async function openDetail(id) {
  cur = id; $('#d-err').textContent = '';
  try {
    const { text, backlinks, row } = await api('show', { id });
    const r = row || {};
    const back = backlinks.split('\n').filter(Boolean);
    $('#d-id').textContent = id;
    $('#d-when').textContent = r.created ? new Date(r.created).toLocaleString() : '';
    $('#d-text').value = text;
    $('#d-back').innerHTML = back.map(l => linkify(l)).join('\n');
    $('#d-tags').innerHTML = Object.entries(r.tags || {}).map(([k, v]) => tagChip(k, v, `data-rm="${esc(k)}"`).replace('</button>', '<span class="x">✕</span></button>')).join('');
    $('#d-close').style.display = 'done' in (r.tags || {}) ? 'none' : '';
    $('#d-reopen').style.display = 'done' in (r.tags || {}) ? '' : 'none';
    if (!$('#detail').open) $('#detail').showModal();
  } catch (e) { $('#d-err').textContent = e.message; }
}
async function act(verb, body) {
  $('#d-err').textContent = '';
  try { await api(verb, { id: cur, ...body }); await openDetail(cur); refresh(); } catch (e) { $('#d-err').textContent = e.message; }
}
$('#d-x').onclick = () => $('#detail').close();
$('#d-sub').onclick = () => { const c = $('#capture'); c.value = `@parent=#${cur} @todo `; $('#detail').close(); c.focus(); c.selectionStart = c.selectionEnd = c.value.length; };
$('#d-save').onclick = () => act('edit', { text: $('#d-text').value });
$('#d-close').onclick = () => act('tag', { patch: ['@done'] });
$('#d-reopen').onclick = () => act('tag', { patch: ['-@done'] });
$('#d-addtag').onkeydown = e => { if (e.key === 'Enter' && e.target.value.trim()) { act('tag', { patch: e.target.value.trim().split(/\s+/) }); e.target.value = ''; } };
$('#d-tags').onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { e.stopPropagation(); act('tag', { patch: ['-@' + b.dataset.rm] }); } };
$('#d-text').onkeydown = e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') $('#d-save').onclick(); };
$('#detail').onclose = () => { cur = null; };

// @ completion: names, then items after =, on every field that takes tags
const ac = { el: $('#ac'), field: null, items: [], sel: 0, span: null };
function acHide() { ac.el.style.display = 'none'; ac.field = null; }
function acUpdate(field) {
  const before = field.value.slice(0, field.selectionStart);
  const m = before.match(/(^|\s)(-?@)([A-Za-z_][\w-]*)?(?:(=)((?:[^\s,]*,)*)([^\s,]*))?$/);
  if (!m) return acHide();
  const [, , sigil, name = '', eq, done = '', part = ''] = m;
  const names = Object.keys(state.vocab);
  let list, prefix;
  if (eq) { list = (state.vocab[name] || []).filter(v => v.startsWith(part) && !done.split(',').includes(v)).map(v => sigil + name + '=' + done + v); prefix = sigil + name + '=' + done + part; }
  else { list = names.filter(n => n.startsWith(name)).map(n => sigil + n); prefix = sigil + name; }
  list = list.filter(t => t !== prefix).slice(0, 12);
  if (!list.length) return acHide();
  ac.field = field; ac.items = list; ac.sel = 0; ac.span = [before.length - prefix.length, before.length];
  ac.el.innerHTML = list.map((t, i) => `<div class="${i ? '' : 'sel'}" data-i="${i}">${esc(t)}</div>`).join('');
  const r = field.getBoundingClientRect(), up = r.top > innerHeight / 2;
  ac.el.style.left = r.left + 'px'; ac.el.style.top = up ? '' : r.bottom + 4 + 'px'; ac.el.style.bottom = up ? innerHeight - r.top + 4 + 'px' : ''; ac.el.style.display = 'block';
  if (field.closest('dialog')) field.closest('dialog').appendChild(ac.el); else document.body.appendChild(ac.el);
}
function acPick(i) {
  const f = ac.field, t = ac.items[i], [a, b] = ac.span;
  const tail = t.endsWith('=') ? '' : (f.value[b] === ' ' || f.value[b] === '\n' ? '' : ' ');
  f.value = f.value.slice(0, a) + t + tail + f.value.slice(b);
  f.selectionStart = f.selectionEnd = a + t.length + tail.length;
  acHide(); f.dispatchEvent(new Event('input')); f.focus();
}
for (const f of [$('#capture'), $('#filter'), $('#d-addtag')]) {
  f.addEventListener('input', () => acUpdate(f));
  f.addEventListener('keydown', e => {
    if (ac.field !== f) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { ac.sel = (ac.sel + (e.key === 'ArrowDown' ? 1 : ac.items.length - 1)) % ac.items.length; [...ac.el.children].forEach((c, i) => c.classList.toggle('sel', i === ac.sel)); e.preventDefault(); }
    else if (e.key === 'Enter' || e.key === 'Tab') { acPick(ac.sel); e.preventDefault(); e.stopImmediatePropagation(); }
    else if (e.key === 'Escape') acHide();
  }, true);
  f.addEventListener('blur', () => setTimeout(() => { if (ac.field === f) acHide(); }, 150));
}
ac.el.onmousedown = e => { const d = e.target.closest('[data-i]'); if (d) { e.preventDefault(); acPick(+d.dataset.i); } };

// boot + poll
api('dbs').then(dbs => {
  if (!dbs.length) return;
  if (state.db && !dbs.includes(state.db)) state.db = '';
  const sel = $('#dbsel');
  sel.innerHTML = ['', ...dbs].map(n => `<option value="${esc(n)}" ${n === state.db ? 'selected' : ''}>${n ? esc(n) : 'default'}</option>`).join('');
  sel.hidden = false;
  sel.onchange = () => { state.db = sel.value; try { localStorage.setItem('jn.db', state.db); } catch {} refresh(); };
});
api('config').then(c => { state.cfg = c; renderNamed(); refresh(); });
setInterval(() => { if (document.visibilityState === 'visible' && !$('#detail').open) refresh(); }, 5000);
</script>
</body>
</html>
