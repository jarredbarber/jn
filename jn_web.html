<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1214">
<title>jn</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230d1214'/%3E%3Ctext x='9' y='47' font-family='Georgia,serif' font-size='44' font-style='italic' fill='%23dbe4e4'%3Ej%3Ctspan font-style='normal' font-weight='bold' fill='%232dd4bf'%3En%3C/tspan%3E%3C/text%3E%3C/svg%3E">
<style>
/* Colors are a base16 palette (--base00..--base0F) plus --acc, one of its slots. Every rule below reads the semantic
   names, which derive from those 16; a theme (see THEMES) only sets the 16 + the accent slot. These defaults are the
   github scheme, so the page paints right before the script runs. */
:root {
  --base00:#0d1117; --base01:#161b22; --base02:#30363d; --base03:#6e7681; --base04:#8b949e; --base05:#e6edf3; --base06:#f0f6fc; --base07:#f0f6fc;
  --base08:#ff7b72; --base09:#f0883e; --base0A:#d29922; --base0B:#3fb950; --base0C:#76e3ea; --base0D:#58a6ff; --base0E:#bc8cff; --base0F:#f778ba;
  --acc:var(--base0D);
}
@media (prefers-color-scheme: light) { :root {
  --base00:#ffffff; --base01:#f6f8fa; --base02:#d0d7de; --base03:#57606a; --base04:#32383f; --base05:#1f2328; --base06:#24292f; --base07:#1f2328;
  --base08:#cf222e; --base09:#bc4c00; --base0A:#9a6700; --base0B:#116329; --base0C:#1b7c83; --base0D:#0969da; --base0E:#8250df; --base0F:#953800;
} }
:root {
  --bg:var(--base00); --side:var(--base01); --field:var(--base01); --ink:var(--base05); --mute:var(--base04); --dim:var(--base03);
  --line:color-mix(in srgb, var(--base05) 10%, var(--base00)); --hover:color-mix(in srgb, var(--base05) 5%, var(--base00));
  --sel:color-mix(in srgb, var(--acc) 15%, var(--base00)); --accbg:color-mix(in srgb, var(--acc) 14%, transparent);
  --on-acc:var(--base00); --agent:var(--base09); --err:var(--base08); --link:var(--acc);
  --sans:-apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif; --mono:ui-monospace, "SF Mono", Menlo, monospace; --r:6px;
}
* { box-sizing:border-box }
html, body { background:var(--bg) }
body { margin:0; color:var(--ink); font:13px/1.45 var(--sans) }
::selection { background:var(--acc); color:var(--on-acc) }
:focus-visible { outline:2px solid var(--acc); outline-offset:1px }
button, input, textarea, select { font:inherit; color:inherit }
a { color:var(--link) }
button { background:transparent; border:1px solid var(--line); border-radius:var(--r); padding:5px 11px; cursor:pointer }
button:hover { border-color:var(--mute) }
button.primary { background:var(--acc); border-color:var(--acc); color:var(--on-acc); font-weight:600 }
button.primary:hover { filter:brightness(1.08) }
select { background:var(--field); border:1px solid var(--line); border-radius:var(--r); padding:3px 6px; font-size:12px }
.err { color:var(--err); font-size:12px }

/* three columns: nav, list, detail pane (only while an entry is open) */
.w { display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh }
.w.det { grid-template-columns:232px minmax(0,1fr) minmax(360px, 38%) }
nav { background:var(--side); border-right:1px solid var(--line); padding:12px 10px; position:sticky; top:0; height:100vh; overflow:auto; display:flex; flex-direction:column }
.brand { display:flex; align-items:center; gap:8px; padding:2px 8px 14px }
.brand a { font:italic 700 20px/1 ui-serif, Georgia, serif; letter-spacing:-.02em; color:var(--ink); text-decoration:none }
.brand a b { color:var(--acc); font-style:normal }
.brand select { margin-left:auto; max-width:110px }
.tab, .grp, #pages a { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:5px 8px; border-radius:var(--r); color:var(--mute); cursor:pointer; text-decoration:none; border-left:2px solid transparent; white-space:nowrap }
.tab:hover, .grp:hover, #pages a:hover { background:var(--hover); color:var(--ink) }
.tab.on { background:var(--accbg); color:var(--ink); border-left-color:var(--acc) }
.tab .new { color:var(--acc); font-weight:600; font-size:11px } .n { color:var(--dim); font-variant-numeric:tabular-nums; font-size:12px }
.grps { margin:2px 0 6px } .grp { padding-left:20px; font-size:12px } .grp.on { color:var(--acc) } .grp span:first-child { overflow:hidden; text-overflow:ellipsis }
.lab { color:var(--dim); font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; margin:18px 8px 6px }
#pages a { display:block; overflow:hidden; text-overflow:ellipsis }
#cal { display:grid; grid-template-rows:repeat(7, 1fr); grid-auto-flow:column; gap:2px; padding:0 8px; position:relative }
#cal .cell { aspect-ratio:1; border-radius:2px; background:var(--line) }
#cal .l1 { background:color-mix(in srgb, var(--acc) 28%, transparent) } #cal .l2 { background:color-mix(in srgb, var(--acc) 50%, transparent) }
#cal .l3 { background:color-mix(in srgb, var(--acc) 75%, transparent) } #cal .l4 { background:var(--acc) } #cal .lx { background:transparent }
#cal .cell:hover::after { content:attr(aria-label); position:absolute; left:8px; bottom:calc(100% + 4px); z-index:10; padding:4px 8px; border-radius:var(--r); background:var(--ink); color:var(--bg); font-size:12px; white-space:nowrap; pointer-events:none }
.gear { border:0; padding:2px 4px; color:var(--dim); font-size:15px; line-height:1 } .gear:hover { color:var(--acc) } #dbsel:not([hidden]) + .gear { margin-left:0 } .brand .gear { margin-left:auto }
#dbsel:not([hidden]) { margin-left:auto }
#settings { background:var(--side); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:16px 18px 18px; width:min(460px, calc(100vw - 32px)); box-shadow:0 12px 40px #0008 }
#settings::backdrop { background:color-mix(in srgb, var(--base00) 55%, transparent) }
#settings .sh { display:flex; align-items:center; font-size:14px; font-weight:600 } #settings .sh .x { margin-left:auto; border:0; font-size:15px; padding:0 4px }
#settings .lab { margin:16px 0 6px }
.schemes { display:grid; grid-template-columns:1fr 1fr; gap:8px }
.scheme { display:flex; flex-direction:column; gap:7px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; cursor:pointer }
.scheme:hover { border-color:var(--mute) } .scheme:has(input:checked) { border-color:var(--acc); box-shadow:0 0 0 2px var(--accbg) }
.scheme input, .seg input { position:absolute; opacity:0; pointer-events:none }
.scheme .nm { display:flex; justify-content:space-between; font-weight:500 } .scheme .nm small { color:var(--dim); font-weight:400 }
.sw { display:flex; border-radius:4px; overflow:hidden; height:16px } .sw i { flex:1 }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden }
.seg label { padding:5px 14px; cursor:pointer; color:var(--mute) } .seg label + label { border-left:1px solid var(--line) }
.seg label:has(input:checked) { background:var(--accbg); color:var(--ink) } .seg label:has(input:focus-visible) { outline:2px solid var(--acc); outline-offset:-2px }
#dbpath { color:var(--mute); font:12px var(--mono); word-break:break-all }

main { padding:14px 22px 60px; min-width:0 }
.cap { display:flex; gap:8px; align-items:stretch }
.qe { flex:1; min-width:0; display:flex; flex-wrap:wrap; align-items:flex-start; gap:5px; background:var(--field); border:1px solid var(--line); border-radius:7px; padding:4px 6px }
.qe:focus-within, #filter:focus { border-color:var(--acc); box-shadow:0 0 0 3px var(--accbg) }
#chips:empty { display:none } #chips { display:contents }
.ih { margin-top:5px; font-size:11.5px; color:var(--acc); background:var(--accbg); border-radius:5px; padding:2px 4px 2px 7px; white-space:nowrap }
.ih button { border:0; padding:0 0 0 5px; font-size:11px; opacity:.6; color:inherit } .ih button:hover { opacity:1 }
#capture { flex:1; min-width:160px; border:0; background:none; outline:none; resize:none; padding:6px 4px; min-height:30px; field-sizing:content; max-height:40vh; line-height:1.45 }
button.add { flex:none; padding:0 16px; border-radius:7px }
#pending:not(:empty) { margin-top:8px }
.sbar { display:flex; gap:10px; align-items:center; margin:10px 0 4px }
#filter { flex:1; min-width:0; background:var(--field); border:1px solid var(--line); border-radius:7px; padding:7px 10px; outline:none }
#status { color:var(--dim); font-size:12px; white-space:nowrap }

/* rows: one line each, in both layouts */
.h { display:flex; gap:8px; align-items:baseline; color:var(--mute); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; margin:18px 0 2px; padding:0 8px }
.h .n { color:var(--acc); font-weight:500 } .h::after { content:""; flex:1; border-bottom:1px solid var(--line); transform:translateY(-3px) }
.r { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; padding:4px 8px; border-radius:var(--r); cursor:pointer; white-space:nowrap; min-height:28px }
.r:hover { background:var(--hover) } .r.sel { background:var(--sel); box-shadow:inset 2px 0 var(--acc) }
.r .lead { display:flex; align-items:center; gap:4px; padding-left:calc(var(--d, 0) * 18px) }
.r .x { overflow:hidden; text-overflow:ellipsis } .r.done .x { text-decoration:line-through; color:var(--dim) }
.r .ctx { color:var(--dim); margin-right:6px; font-size:12px }
.r .tm { color:var(--dim); font-size:11.5px; font-variant-numeric:tabular-nums; min-width:58px }
.r code { font:.88em var(--mono); background:var(--hover); border-radius:4px; padding:0 4px }
.meta { display:flex; gap:6px; align-items:center; overflow:hidden; max-width:50ch; justify-content:flex-end }
.chip { font-size:11px; color:var(--mute); overflow:hidden; text-overflow:ellipsis; cursor:pointer } .chip:hover { color:var(--ink) }
.chip.tinted { color:var(--tc) } .chip.pj { color:var(--acc) } .chip .ref { color:var(--acc); text-decoration:none }
.ag { font-size:10.5px; color:var(--agent); border:1px solid color-mix(in srgb, var(--agent) 40%, transparent); border-radius:99px; padding:0 6px }
.id, .eid { color:var(--dim); font:11px var(--mono); text-decoration:none } .eid:hover { color:var(--acc) }
.prog { font:11px var(--mono); color:var(--acc) }
.chev { border:0; padding:0; width:16px; height:16px; display:inline-grid; place-content:center; color:var(--mute) } .chev:hover { color:var(--acc) }
.chev.none { visibility:hidden }
.empty { color:var(--dim); padding:30px 8px; font-size:14px }
input[type=checkbox] { appearance:none; margin:0; flex:none; width:14px; height:14px; border:1.5px solid var(--dim); border-radius:4px; background:transparent; cursor:pointer; display:inline-grid; place-content:center; vertical-align:-2px }
input[type=checkbox]:hover { border-color:var(--acc) }
input[type=checkbox]:checked { background:var(--acc); border-color:var(--acc) }
input[type=checkbox]:checked::after { content:""; width:7px; height:4px; border:solid var(--on-acc); border-width:0 0 2px 2px; transform:translateY(-1px) rotate(-45deg) }

/* detail pane */
#det { border-left:1px solid var(--line); background:var(--side); padding:14px 20px 40px; position:sticky; top:0; height:100vh; overflow:auto; min-width:0 }
#det[hidden] { display:none }
.dtop { display:flex; gap:8px; align-items:center; color:var(--mute); font-size:12px; margin-bottom:8px }
.dtop .x { margin-left:auto; border:0; font-size:15px; padding:0 4px }
.anc { color:var(--dim); font-size:12px; margin-bottom:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.anc a { color:var(--mute); text-decoration:none } .anc a:hover { color:var(--acc) }
.tagrow { display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin-bottom:10px }
.tagrow .chip { border:1px solid var(--line); border-radius:5px; padding:1px 4px 1px 7px; font-size:11.5px; color:var(--mute) }
.tagrow .chip.pj { border-color:color-mix(in srgb, var(--acc) 40%, transparent) }
.tagrow .chip .x { margin-left:5px; opacity:.5 } .tagrow .chip .x:hover { opacity:1; color:var(--err) }
.tagrow input { flex:1; min-width:120px; padding:3px 6px; font-size:12px; background:transparent; border:1px solid transparent; border-radius:5px; outline:none }
.tagrow input:focus, .tagrow input.editing { border-color:var(--line); background:var(--bg) }
.tagrow input.editing { flex:0 0 auto; width:max-content; min-width:80px }
#det .content { width:100%; min-height:160px; field-sizing:content; background:var(--bg); border:1px solid var(--line); border-radius:var(--r); padding:10px 12px; font:13px/1.55 var(--mono); outline:none; resize:vertical }
#det .content:focus { border-color:var(--acc) }
.actions { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:12px 0 }
.editor:not(.editing) .when-edit, .editor.editing .when-view { display:none }
.kids { margin-top:14px } .kids .lab { margin:0 0 4px }
.kid { display:grid; grid-template-columns:18px minmax(0,1fr) auto; gap:8px; align-items:center; padding:3px 0; border-bottom:1px solid var(--line); white-space:nowrap }
.kid span { overflow:hidden; text-overflow:ellipsis } .kid.done span { color:var(--dim); text-decoration:line-through }
.back { margin-top:12px; color:var(--mute); font-size:12px; white-space:pre-wrap }

/* rendered markdown (detail pane, pages) */
.md { min-width:0; word-break:break-word; font-size:13.5px; line-height:1.6 }
.md > :first-child { margin-top:0 } .md > :last-child { margin-bottom:0 }
.md p, .md ul, .md ol, .md pre, .md blockquote, .md table { margin:0 0 .7em }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font-size:14px; font-weight:650; margin:1em 0 .4em } .md h1 { font-size:17px } .md h2 { font-size:15px }
.md code, .md pre { font:12.5px/1.5 var(--mono); background:var(--bg); border:1px solid var(--line); border-radius:var(--r) }
.md code { padding:0 4px } .md pre { padding:8px 10px; overflow:auto } .md pre code { border:0; padding:0; background:none }
.md blockquote { border-left:2px solid var(--acc); color:var(--mute); margin-left:0; padding-left:12px }
.md ul, .md ol { padding-left:1.4em } .md li > ul, .md li > ol, .md li > p { margin-bottom:0 }
.md li.task { list-style:none; margin-left:-1.4em } .md input[type=checkbox] { margin-right:.5em }
.md a { color:var(--link) } .md del { color:var(--dim) }
.md img { max-width:100%; height:auto; border:1px solid var(--line); border-radius:var(--r) }
.md hr { border:0; border-top:1px solid var(--line); margin:1em 0 }
.md table { border-collapse:collapse; font-size:12.5px; display:block; max-width:100%; overflow:auto }
.md th, .md td { border:1px solid var(--line); padding:3px 8px; text-align:left } .md th { background:var(--bg) }
a.ref, a.tag { color:var(--acc); text-decoration:none; cursor:pointer } a.ref:hover, a.tag:hover { text-decoration:underline }
.jnq, .jnx { margin:0 0 .9em; border:1px solid var(--line); border-radius:var(--r); background:var(--bg) }
.jnq-h { padding:4px 10px; color:var(--mute); font-size:11.5px; border-bottom:1px solid var(--line) } .jnq-h:last-child { border-bottom:0 }
.jnq-r { display:grid; grid-template-columns:20px minmax(0,1fr) auto; gap:6px; padding:4px 10px; border-bottom:1px solid var(--line); align-items:center }
.jnq-r.done > :nth-child(2) { color:var(--dim); text-decoration:line-through }
.jnq-g { display:flex; justify-content:space-between; gap:10px; padding:4px 10px; border-bottom:1px solid var(--line) } .jnq-g em { color:var(--acc); font-style:normal }
.jnx { border-left:2px solid var(--acc); background:none } .jnx .md { padding:4px 10px }

/* attachments */
.att { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; align-items:flex-start } .att:empty { display:none }
.att-item { display:inline-flex; align-items:flex-start; gap:4px; font-size:12px; max-width:100% }
.att img { display:block; max-height:140px; max-width:100%; border:1px solid var(--line); border-radius:var(--r) }
.att a { color:var(--acc); text-decoration:none; word-break:break-all }
.att .x, .att .ins { color:var(--mute); cursor:pointer; padding:0 2px } .att .ins { font-size:11px; border:1px solid var(--line); border-radius:4px; padding:0 5px }
.att .x:hover, .att .ins:hover { color:var(--acc) }
.clip { font-size:11px; color:var(--dim) }

/* @ completion */
#ac { position:fixed; z-index:20; background:var(--side); color:var(--ink); border:1px solid var(--line); border-radius:var(--r); box-shadow:0 6px 24px #0006; max-height:40vh; overflow:auto; overscroll-behavior:contain; min-width:180px; display:none }
#ac div { padding:5px 10px; cursor:pointer } #ac div.sel { background:var(--acc); color:var(--on-acc) }

/* phone: nav collapses to a strip, the pane covers the screen */
@media (max-width: 760px) {
  .w, .w.det { grid-template-columns:minmax(0,1fr) }
  nav { position:static; height:auto; border-right:0; border-bottom:1px solid var(--line); padding:10px 12px 6px }
  .brand { padding:0 0 8px } #tabs { display:flex; flex-wrap:wrap; gap:4px }
  #tabs .grps { flex-basis:100%; display:flex; overflow-x:auto; gap:2px; margin:2px 0 } .grp { padding-left:8px }
  .tab { border-left:0; border-bottom:2px solid transparent; border-radius:0 } .tab.on { border-bottom-color:var(--acc) }
  #calbox, #pagebox { display:none }
  main { padding:10px 12px 60px }
  .meta { max-width:14ch } .meta .chip, .meta .eid, .r .ctx { display:none }
  #det { position:fixed; inset:0; height:auto; z-index:30; border-left:0 }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important } }
</style>
</head>
<body>
<div class="w" id="w">
<nav>
  <div class="brand"><a href="/" id="home">j<b>n</b></a><select id="dbsel" hidden aria-label="Journal"></select><button class="gear" id="gear" aria-label="Settings" title="Settings  ( , )">⚙</button></div>
  <div id="tabs"></div>
  <div id="pagebox" hidden><div class="lab">pages</div><div id="pages"></div></div>
  <div id="calbox"><div class="lab">activity</div><div id="cal"></div></div>
</nav>
<main>
  <div class="cap"><div class="qe"><span id="chips"></span><textarea id="capture" rows="1" placeholder="Quick entry…  @tags  ⌘↩"></textarea></div><button id="save" class="primary add">Add</button></div>
  <span id="cap-err" class="err"></span><div class="att" id="pending"></div>
  <div class="sbar"><input id="filter" placeholder="Search  ( / )   words, @tag, -@tag, --since 1w" autocomplete="off"><span id="status"></span></div>
  <section id="list"></section>
</main>
<aside id="det" hidden></aside>
</div>
<div id="ac"></div>
<dialog id="settings" aria-label="Settings"><form method="dialog">
  <div class="sh">Settings<button class="x" value="close" aria-label="Close">✕</button></div>
  <div class="lab">Color scheme</div><div class="schemes" id="schemes"></div>
  <div class="lab">Appearance</div><div class="seg" id="modes"><label><input type="radio" name="mode" value="system">system</label><label><input type="radio" name="mode" value="dark">dark</label><label><input type="radio" name="mode" value="light">light</label></div>
  <div class="lab">Journal</div><div id="dbpath"></div>
</form></dialog>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state = { cfg: { filters: [] }, vocab: {}, db: '', tab: '', group: null, q: '', rows: [], counts: {}, exp: {}, extra: [], dropped: new Set() };
try { state.db = localStorage.getItem('jn.db') || ''; } catch {}
let cur = null;  // id of the entry open in the detail pane

async function api(verb, body = {}) {
  const r = await fetch('/api/' + verb, { method: 'POST', body: JSON.stringify(state.db ? { db: state.db, ...body } : body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j.out;
}

// ---- themes: base16 palettes (base00 bg ... base05 fg ... base08-0F accents); acc names the slot used as the accent.
// Sources: vague2k/vague.nvim lua/vague/config/internal.lua; sainnhe/everforest autoload/everforest.vim (medium);
// projekt0n/github-nvim-theme palette/github_dark_default.lua + github_light_default.lua (primitives). Add one = add an entry.
const THEMES = {
  vague: { acc: 'base0D',
    dark: { base00:'#141415', base01:'#1c1c24', base02:'#333738', base03:'#606079', base04:'#878787', base05:'#cdcdcd', base06:'#c3c3d5', base07:'#c3c3d5', base08:'#d8647e', base09:'#e0a363', base0A:'#f3be7c', base0B:'#7fa563', base0C:'#b4d4cf', base0D:'#6e94b2', base0E:'#bb9dbd', base0F:'#c48282' } },
  everforest: { acc: 'base0B',
    dark: { base00:'#2d353b', base01:'#343f44', base02:'#475258', base03:'#859289', base04:'#9da9a0', base05:'#d3c6aa', base06:'#d3c6aa', base07:'#d3c6aa', base08:'#e67e80', base09:'#e69875', base0A:'#dbbc7f', base0B:'#a7c080', base0C:'#83c092', base0D:'#7fbbb3', base0E:'#d699b6', base0F:'#7a8478' },

function boot() { return api('config').then(c => { state.cfg = c; setDbPath(c.db); if (state.tab && !tabList().some(f => f.name === state.tab)) state.tab = ''; refresh(); refreshCounts(); }); }
boot();
setInterval(() => { if (document.visibilityState === 'visible') refreshCounts(); }, 30000);
setInterval(() => { if (document.visibilityState === 'visible' && cur === null && !typingIn()) refresh(); }, 5000);
</script>
</body>
