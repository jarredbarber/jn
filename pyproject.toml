[project]
name = "jn"
version = "1.0.1"
description = "Microjournal + task log for humans and agents. One file, stdlib only."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
jn = "jn:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["jn.py", "jn_web.py", "jn_web.html", "skills"]   # skills/ ships beside jn.py so `jn --skill` works when installed
